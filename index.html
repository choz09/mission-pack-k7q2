<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex,nofollow">
<title>NINE MISSION PACK</title>
<style>
:root{--strip:64px;--gold:#d8b25e;--gold2:#e8cc88;--ink:#060a16;--txt:#f3ead2;--c:#cfd6e4;--zz:none}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--txt);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;--old:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
body{background:radial-gradient(ellipse 70% 60% at 50% 45%,#16223f 0,#0a1020 62%,#05070f 100%)}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:800px;margin:-400px 0 0 -640px;transform-origin:50% 50%}
#world{position:absolute;inset:0}
#world.shake{animation:shake .6s linear}
@keyframes shake{0%,100%{transform:translate(0,0)}10%{transform:translate(-9px,5px)}25%{transform:translate(8px,-7px)}40%{transform:translate(-7px,-4px)}55%{transform:translate(6px,6px)}70%{transform:translate(-4px,3px)}85%{transform:translate(3px,-2px)}}
.script{font-family:"Snell Roundhand","Segoe Script","Brush Script MT",cursive}
.serif{font-family:Georgia,"Times New Roman","Hiragino Mincho ProN",serif}

/* header */
#brand{position:absolute;left:40px;top:26px;text-align:center;z-index:20;transition:opacity .5s}
#brand.off{opacity:0;pointer-events:none}
#brand .n{font-size:36px;line-height:1;color:var(--gold2)}
#brand .m{font-size:15px;letter-spacing:.5em;text-indent:.5em;color:rgba(243,234,210,.88);margin-top:7px}
.sbtn{position:absolute;top:28px;z-index:20;height:50px;padding:0 24px;border:1px solid rgba(216,178,94,.7);background:rgba(8,14,32,.75);color:var(--gold2);font-size:17px;letter-spacing:.08em;border-radius:25px;font-family:inherit}
#btnProb{right:40px}#btnSnd{right:140px}

/* ring */
#ringwrap{position:absolute;left:640px;top:430px;width:0;height:0;perspective:1500px;transition:opacity .35s}
#tilt{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;transform:rotateX(-9deg)}
#ring{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.rp{position:absolute;left:-110px;top:-180px;width:220px;height:360px;transform-style:preserve-3d}
.rp .face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.rp .back{transform:rotateY(180deg)}
.rp .shade{position:absolute;inset:0;background:#030612;opacity:0;pointer-events:none;clip-path:var(--zz)}

/* pack art (220x360) */
.art{position:absolute;inset:0;clip-path:var(--zz);background:linear-gradient(100deg,#0f1a3a 0%,#1d2f63 42%,#12204a 62%,#0b1330 100%);overflow:hidden}
.art .crimp{position:absolute;left:0;right:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.13) 0 2px,rgba(0,0,0,.2) 2px 5px)}
.art .crimp.t{top:0;height:46px;box-shadow:inset 0 -14px 14px -10px rgba(0,0,0,.35)}
.art .crimp.b{bottom:0;height:34px}
.art .frame{position:absolute;left:14px;right:14px;top:74px;bottom:42px;border:1px solid rgba(216,178,94,.55)}
.art .pn{position:absolute;left:0;right:0;top:80px;text-align:center;font-size:50px;line-height:1;color:var(--gold2)}
.art .pr{position:absolute;left:0;right:0;top:262px;text-align:center;font-size:15px;font-weight:600;letter-spacing:.42em;text-indent:.42em;color:#c9a95f}
.art .pm{position:absolute;left:0;right:0;top:286px;text-align:center;font-size:12px;letter-spacing:.3em;text-indent:.3em;color:rgba(243,234,210,.72)}
.art .pf{position:absolute;left:0;right:0;bottom:56px;text-align:center;font-size:10px;letter-spacing:.25em;text-indent:.25em;color:rgba(243,234,210,.5)}
.art .sheen{position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.09),transparent);animation:sheen 5s linear infinite}
@keyframes sheen{0%{transform:translateX(0)}60%,100%{transform:translateX(420%)}}

/* opener */
#pk{position:absolute;left:530px;top:250px;width:220px;height:360px;display:none;transition:transform .6s cubic-bezier(.2,.8,.2,1);transform:scale(1)}
#pk.big{transform:scale(1.45)}
#pk .layer{position:absolute;inset:0}
#pk .sheen{display:none}
#pk .body{clip-path:inset(var(--strip) 0 0 0);z-index:3;transition:transform .7s cubic-bezier(.5,0,.9,.5),opacity .7s}
#pk .tl,#pk .tr,#pk .cut{z-index:5}
#pk .fly{transition:transform .8s cubic-bezier(.4,0,.9,.5),opacity .8s}
#seam{position:absolute;top:calc(var(--strip) - 3px);height:3px;z-index:4;background:#ffe3a0;box-shadow:0 0 6px 1px rgba(255,208,110,.7);opacity:0;border-radius:3px}
#guide{position:absolute;left:0;top:calc(var(--strip) - 1px);width:220px;height:2px;z-index:6;pointer-events:none;opacity:.8;transition:opacity .3s;background:linear-gradient(90deg,transparent 0,rgba(255,228,160,.95) 50%,transparent 100%);background-size:45% 100%;background-repeat:no-repeat;animation:guidemove 1.8s ease-in-out infinite}
@keyframes guidemove{0%{background-position:-60% 0}100%{background-position:160% 0}}
#floor{position:absolute;left:250px;top:610px;width:780px;height:90px;border-radius:50%;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(120,140,225,.26) 0,rgba(0,0,0,0) 70%);transition:opacity .35s}
#aura{position:absolute;left:-80px;top:-31px;width:380px;height:380px;border-radius:50%;opacity:0;z-index:0;pointer-events:none;transition:opacity .8s;background:radial-gradient(circle,var(--c) 0,rgba(0,0,0,0) 62%)}
#aura.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.92)}50%{transform:scale(1.08)}}
#aura i{position:absolute;inset:-6%;border-radius:50%;opacity:0;background:conic-gradient(#ff5f8a,#ffd36b,#8cff9d,#5fd4ff,#9a7bff,#ff5f8a);-webkit-mask:radial-gradient(circle,transparent 52%,#000 56%,transparent 70%);mask:radial-gradient(circle,transparent 52%,#000 56%,transparent 70%);animation:spin 5s linear infinite}
/* LEGEND: 暗い背景のまま、上から淡い虹色の光が降り、奥に淡い虹の輪が広がる(Shadowverseの演出を参考にした上品な虹) */
#prism,#arcs{position:absolute;pointer-events:none;opacity:0;transition:opacity 1.6s ease}
#prism{left:-200px;top:-300px;width:1680px;height:1100px;mix-blend-mode:screen;transform-origin:50% -340px;animation:prismsway 8s ease-in-out infinite;-webkit-mask-image:linear-gradient(to bottom,#000 0,#000 55%,transparent 95%);mask-image:linear-gradient(to bottom,#000 0,#000 55%,transparent 95%)}
#prism .w,#prism .b,#prism .g{position:absolute;inset:0}
#prism .g{background:radial-gradient(ellipse 700px 340px at 50% 300px,rgba(255,238,196,.30),rgba(255,238,196,0) 72%)}
#prism .b{animation:beamshimmer 3.4s ease-in-out infinite}
#prism.on{opacity:.75}#prism.hot{opacity:1}
@keyframes prismsway{0%,100%{transform:rotate(-.8deg)}50%{transform:rotate(.8deg)}}
@keyframes beamshimmer{0%,100%{opacity:.55}50%{opacity:1}}
#arcs{left:250px;top:7px;width:780px;height:780px;border-radius:50%;mix-blend-mode:screen;
  background:radial-gradient(circle at 50% 50%,rgba(0,0,0,0) 0,rgba(0,0,0,0) 214px,rgba(255,150,196,.10) 226px,rgba(255,232,160,.10) 248px,rgba(166,255,196,.09) 270px,rgba(156,222,255,.10) 292px,rgba(194,166,255,.10) 314px,rgba(0,0,0,0) 340px)}
#arcs.on{opacity:.7}#arcs.hot{opacity:.95}
@keyframes spin{to{transform:rotate(360deg)}}

#cw{position:absolute;left:15px;top:70px;width:190px;height:266px;z-index:1;perspective:800px;transform:translateY(0);transition:transform .9s cubic-bezier(.2,.9,.25,1)}
#cw.settle{transition:transform .6s cubic-bezier(.3,.8,.2,1)}
#card{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.7,.2,1)}
#card.flip{transform:rotateY(180deg)}
#card .cb,#card .cf{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:10px;overflow:hidden}
#card .cb{background:#0b1430;border:3px solid var(--gold);box-shadow:0 0 14px rgba(216,178,94,.3);transition:border-color .5s,box-shadow .5s}
#card .cb::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(216,178,94,.16) 0 1px,transparent 1px 13px),repeating-linear-gradient(-45deg,rgba(216,178,94,.16) 0 1px,transparent 1px 13px)}
#card .cb .nn{position:absolute;left:0;right:0;top:92px;text-align:center;font-size:58px;line-height:1;color:var(--gold2)}
#card .cb .mm{position:absolute;left:0;right:0;top:160px;text-align:center;font-size:10px;letter-spacing:.3em;text-indent:.3em;color:rgba(243,234,210,.7)}
#cw.rk #card .cb{border-color:var(--c);box-shadow:0 0 var(--gl,18px) 2px var(--c)}
#card .cf{transform:rotateY(180deg);background:linear-gradient(165deg,#17264e,#0a1230 70%);border:4px solid var(--c)}
#card .cf .rkn{position:absolute;left:0;right:0;top:16px;text-align:center;font-size:14px;font-weight:700;letter-spacing:.34em;text-indent:.34em;color:var(--c)}
#card .cf .pts{position:absolute;left:0;right:0;top:84px;text-align:center;font-size:36px;font-weight:800;line-height:1;color:#fff;font-family:Georgia,"Times New Roman",serif;white-space:nowrap}
#card .cf .pts.big{font-size:32px}
#card .cf .un{position:absolute;left:0;right:0;top:138px;text-align:center;font-size:15px;letter-spacing:.16em;text-indent:.16em;color:#f3ead2}
#card .cf .bd{position:absolute;left:0;right:0;bottom:20px;text-align:center;font-size:30px;line-height:1;color:var(--gold2)}
#card .cf .holo{position:absolute;inset:0;mix-blend-mode:screen;opacity:0;background:linear-gradient(115deg,transparent 18%,rgba(255,255,255,.28) 34%,rgba(255,130,200,.22) 44%,rgba(120,220,255,.26) 54%,transparent 70%);background-size:260% 100%;animation:holo 3.2s linear infinite}
@keyframes holo{from{background-position:130% 0}to{background-position:-130% 0}}
#cw.r-N{--c:#cfd6e4;--gl:16px}#cw.r-R{--c:#5fb0ff;--gl:28px}#cw.r-E{--c:#c58bff;--gl:46px}#cw.r-L{--c:#ffd36b;--gl:68px}
#aura.r-N{--c:rgba(207,214,228,.55)}#aura.r-R{--c:rgba(95,176,255,.7)}#aura.r-E{--c:rgba(197,139,255,.8)}#aura.r-L{--c:rgba(255,211,107,.9)}
#cw.r-E .holo{opacity:.55}#cw.r-L .holo{opacity:.85}

#fx{position:absolute;left:0;top:0;width:1280px;height:800px;pointer-events:none;z-index:14}
#scrim{position:absolute;left:0;right:0;bottom:0;height:230px;z-index:15;pointer-events:none;opacity:0;transition:opacity .5s;background:linear-gradient(to bottom,rgba(6,10,22,0),rgba(6,10,22,.94) 38%)}
#scrim.on{opacity:1}
#flash{position:absolute;inset:0;opacity:0;pointer-events:none;z-index:31}
#banner{position:absolute;left:0;right:0;top:44px;text-align:center;font-size:64px;font-weight:800;letter-spacing:.16em;text-indent:.16em;opacity:0;pointer-events:none;z-index:25;color:var(--c)}

/* text */
#hint{position:absolute;left:0;right:0;bottom:52px;text-align:center;font-size:26px;letter-spacing:.06em;color:var(--txt);z-index:15;transition:opacity .3s}
#sub{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:17px;letter-spacing:.06em;color:rgba(243,234,210,.88);z-index:15;transition:opacity .3s}
#arrow{display:none;position:absolute;left:0;top:206px;width:1280px;text-align:center;font-size:30px;color:var(--gold2);opacity:0;z-index:12;pointer-events:none;letter-spacing:.3em}
#arrow.on{opacity:.95;animation:sway 1.5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateX(-46px)}50%{transform:translateX(46px)}}

#result{position:absolute;left:0;right:0;top:628px;text-align:center;z-index:16;opacity:0;pointer-events:none;transition:opacity .5s}
#result.on{opacity:1;pointer-events:auto}
#result .note{font-size:28px;font-weight:500;color:var(--gold2);letter-spacing:.04em}
#result .meta{margin-top:10px;font-size:21px;color:#e6e2d4;letter-spacing:.06em;font-variant-numeric:tabular-nums}
#result button{margin-top:22px;height:58px;padding:0 40px;border:1px solid rgba(216,178,94,.9);background:rgba(216,178,94,.16);color:var(--gold2);font-size:19px;border-radius:29px;font-family:inherit;letter-spacing:.06em}

#modal{position:absolute;inset:0;z-index:40;display:none;background:rgba(3,6,14,.78);align-items:center;justify-content:center}
#modal.on{display:flex}
#modal .box{width:620px;max-height:640px;overflow:auto;background:#0d1630;border:1px solid rgba(216,178,94,.55);padding:30px 36px;border-radius:6px}
#modal h3{margin:0 0 16px;font-size:22px;letter-spacing:.12em;color:var(--gold2);font-weight:700}
#modal table{width:100%;border-collapse:collapse;font-size:20px}
#modal td,#modal th{padding:9px 6px;text-align:left;font-weight:500;border-bottom:1px solid rgba(216,178,94,.25);font-variant-numeric:tabular-nums}
#modal p{font-size:15px;line-height:1.7;color:rgba(243,234,210,.75);margin:14px 0 0}
#modal button{margin-top:18px;height:46px;padding:0 30px;border:1px solid rgba(216,178,94,.7);background:transparent;color:var(--gold2);font-size:17px;border-radius:23px;font-family:inherit}
#rot{position:fixed;inset:0;z-index:99;background:#05070f;display:none;align-items:center;justify-content:center;text-align:center;font-size:24px;letter-spacing:.1em;color:var(--gold2);padding:30px;line-height:1.8}

/* ---- トランプ(盤面は16px=112x156、パック内の手札は約10.9px) ---- */
.pc{position:absolute;width:7em;height:9.75em;perspective:60em}
.pc .fl{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.2,1);border-radius:.6em}
.pc .fl.up{transform:rotateY(180deg)}
.pc .fc{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:.6em;overflow:hidden}
.pc .bk{background:#0b1430;border:.3em solid var(--gold)}
.pc .bk::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(216,178,94,.16) 0 1px,transparent 1px .9em),repeating-linear-gradient(-45deg,rgba(216,178,94,.16) 0 1px,transparent 1px .9em)}
.pc .bk .bn{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:2.7em;line-height:1;color:var(--gold2);font-family:"Snell Roundhand","Segoe Script","Brush Script MT",cursive}
.pc .ft{transform:rotateY(180deg);background:#f5f0e2;border:1px solid #cfc6ad}
.pc.flat .ft{transform:none}
.pc .ft.red{color:#9c2a38}.pc .ft.blk{color:#10172e}
.pc .ft{background:#efe3c6;border:0}
.pc .ft::after{content:"";position:absolute;inset:.26em;border:1px solid rgba(176,140,60,.8);border-radius:.38em;box-shadow:inset 0 0 0 .2em #efe3c6,inset 0 0 0 calc(.2em + 1px) rgba(176,140,60,.5);pointer-events:none}
.pc .ft .wm{position:absolute;left:50%;top:50%;width:4.7em;height:1.6em;transform:translate(-50%,-50%);background:url("素材/Nine_ロゴ.png") center/contain no-repeat;opacity:.3;pointer-events:none}
.pc .ft .dm{position:absolute;width:.42em;height:.42em;background:#b08c3c;transform:rotate(45deg);opacity:.85}
.pc .ft .dm.a{right:.62em;top:.62em}.pc .ft .dm.b{left:.62em;bottom:.62em}
.pc .ft .rk{position:absolute;left:.22em;top:.2em;font-style:normal;font-weight:400;font-size:4.1em;line-height:1;letter-spacing:-.04em;font-family:"Abril Fatface","Playfair Display","Hiragino Mincho ProN","Yu Mincho",serif;transform:scaleX(.9);transform-origin:0 0}
.pc .ft .rk.pfd{font-family:"Playfair Display","Abril Fatface",serif;font-weight:900}
.pc .ft .rk.qq{font-size:3.55em;top:.24em;left:.27em}
.pc .ft .su{position:absolute;right:.17em;bottom:.04em;font-size:5.7em;line-height:1;font-family:Georgia,"Times New Roman",serif}
.pc.mini{filter:drop-shadow(0 .3em .45em rgba(0,0,0,.6))}
.pc.mini .ft{background:linear-gradient(160deg,#f2e6c4 0%,#e6d4a6 55%,#dcc794 100%);box-shadow:0 0 0 .13em #d6b463,0 0 0 .22em rgba(50,34,8,.6)}
.pc.mini .ft::after{inset:.3em;border:.09em solid rgba(160,118,36,.95);border-radius:.3em;box-shadow:inset 0 0 0 .22em rgba(0,0,0,0),inset 0 0 0 .3em rgba(160,118,36,.45)}
.pc.mini.l .ft .su{right:.3em}
.pc.mini.mb .bk::before{display:none}
.pc.mini.mb .bk{box-shadow:0 0 0 .13em #d6b463,0 0 0 .22em rgba(50,34,8,.6)}
.pc.win .fl{box-shadow:0 0 1.1em .2em var(--c,#ffd36b)}
.pc.win{z-index:2}
.pc.dim .fc{opacity:.34}
#board{position:absolute;left:0;top:0;width:1280px;height:800px;pointer-events:none}
#ptsline{position:absolute;left:0;right:0;top:128px;text-align:center;font-size:30px;font-weight:700;color:#f3ead2;letter-spacing:.08em;opacity:0;transition:opacity .5s;z-index:25;pointer-events:none}

/* ---- リバーのスクイーズ ---- */
.sq{position:absolute;width:7em;height:9.75em;z-index:5;transition:transform .5s cubic-bezier(.2,.9,.3,1);pointer-events:none}
.sq .sqf,.sq .sqb,.sq .sqfl{position:absolute;left:0;top:0}
.sq .sqf{opacity:0;transition:opacity .2s}
.sq.on .sqf{opacity:1}
.sq .sqb,.sq .sqfl{transition:opacity .2s}
.sq.on .sqb,.sq.on .sqfl{opacity:0}
.sq .sqfl{transform-origin:0 0}
.sq .sqfl::after{content:"";position:absolute;inset:0;border-radius:.6em;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) var(--f,100%),rgba(0,0,0,.36) var(--f,100%),rgba(0,0,0,0) calc(var(--f,100%) + 36%))}
.pc.flat.win{border-radius:.6em;box-shadow:0 0 1.1em .2em var(--c,#ffd36b)}
.pc.hint .bk{animation:tapglow 1.2s ease-in-out infinite}
@keyframes tapglow{0%,100%{box-shadow:0 0 .4em rgba(216,178,94,.2)}50%{box-shadow:0 0 1.6em .2em rgba(216,178,94,.85)}}
#testbar{position:absolute;left:16px;bottom:16px;z-index:30;display:none;max-width:300px;padding:10px 12px;background:rgba(6,10,22,.88);border:1px solid rgba(216,178,94,.5);border-radius:10px;font-size:13px;color:#f3ead2}
#testbar b{display:block;margin:2px 0 5px;color:var(--gold2);font-weight:700;letter-spacing:.05em}
#testbar .row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
#testbar button{height:34px;min-width:34px;padding:0 10px;border:1px solid rgba(216,178,94,.55);background:transparent;color:var(--gold2);border-radius:17px;font-size:13px;font-family:inherit}
#testbar button.on{background:rgba(216,178,94,.28);color:#fff}

/* フラッシュ・ロイヤルフラッシュ: 勝った札の上を光がなぞる(左から順に) */
.pc.shine .ft::before{content:"";position:absolute;inset:-25%;pointer-events:none;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.8) 50%,transparent 62%);transform:translateX(-130%);animation:shinesweep .95s ease-out forwards;animation-delay:var(--d,0s)}
@keyframes shinesweep{from{transform:translateX(-130%)}to{transform:translateX(130%)}}
#suitmark{position:absolute;left:0;right:0;top:128px;text-align:center;font-size:540px;line-height:1;opacity:0;pointer-events:none;font-family:Georgia,"Times New Roman",serif;color:#d9c4ff}

/* 箔押しの光沢(あとから足せる): 金の線など明るい所だけ強く光る。パックを回すと光の位置が動く */
.art .gloss{position:absolute;inset:0;pointer-events:none;opacity:.09;background-image:linear-gradient(105deg,rgba(255,246,222,0) 25%,rgba(255,246,222,1) 50%,rgba(255,246,222,0) 75%);background-size:260% 100%;background-repeat:no-repeat;background-position:var(--gx,60%) 0}
#pk .gloss{display:none}

/* ChatGPTで作ったパックの絵(素材/パック下地.png)があれば自動で使う。無ければ今の仮の絵のまま */
.hasart .art{background:#0b1430 var(--packimg) center/100% 100% no-repeat}
.hasart .art .crimp,.hasart .art .frame,.hasart .art .pm{display:none}
.hasart .art .pn{top:96px;font-size:46px}
.hasart .art .pr{top:246px;font-size:13px;letter-spacing:.34em;text-indent:.34em}
.hasart .art::before{content:"";position:absolute;left:8%;right:8%;top:27%;bottom:25%;background:radial-gradient(ellipse at 50% 50%,rgba(10,18,44,.5),rgba(10,18,44,0) 75%);pointer-events:none;z-index:0}

<script>
"use strict";
/* ===== 設定(運用で変えるのはここ) ===== */
var PRIZES=[
  {id:"N",name:"ONE PAIR",pts:500,w:55,cols:["#ffffff","#cfd6e4","#e8cc88"]},
  {id:"R",name:"STRAIGHT",pts:1000,w:30,cols:["#ffffff","#5fb0ff","#9ad0ff"]},
  {id:"E",name:"FLUSH",pts:3000,w:12,cols:["#ffffff","#c58bff","#ff9bd8","#8f5bff"]},

];
var TICKETS_NEEDED=3;
/* ============================================== */
var TOTAL=PRIZES.reduce(function(a,p){return a+p.w},0);
var $=function(id){return document.getElementById(id)};
var stage=$("stage"),world=$("world"),ring=$("ring"),ringwrap=$("ringwrap"),pk=$("pk");
var Lbody=$("Lbody"),Ltl=$("Ltl"),Ltr=$("Ltr"),Lcut=$("Lcut"),seam=$("seam"),aura=$("aura");
var hint=$("hint"),sub=$("sub"),arrow=$("arrow"),banner=$("banner"),result=$("result"),guide=$("guide");
var ls={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}},del:function(k){try{localStorage.removeItem(k)}catch(e){}}};
var hash=location.hash||"";
var forceRank=(hash.match(/demo=\w+-([NREL])/)||[])[1]||null;

/* ---- fit ---- */
function fit(){
  var s=Math.min(innerWidth/1280,innerHeight/800);

function toStage(e){var r=stage.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*1280,y:(e.clientY-r.top)/r.height*800}}


/* ---- トランプと役の判定(結果は先に抽選で決め、その役になる5枚の盤面を組み立てる) ---- */
var SU=["\u2660\uFE0E","\u2665\uFE0E","\u2666\uFE0E","\u2663\uFE0E"];   /* ♠♥♦♣ (絵文字にならないよう\uFE0E) */
var RC={N:"#cfd6e4",R:"#5fb0ff",E:"#b8a2f2",L:"#ffd36b"};
function rl(r){return r<=10?String(r):({11:"J",12:"Q",13:"K",14:"A"})[r]}
/* パックに描く手札(同じマークのブロードウェイ2枚)。A-K-Q-J-Tの2枚組10通りを1つずつ=リングのパック数(10)と同じ */
var HOLES=[[[14,0],[13,0]],[[14,1],[12,1]],[[13,3],[12,3]],[[14,2],[11,2]],[[12,0],[11,0]],[[13,1],[11,1]],[[14,3],[10,3]],[[13,0],[10,0]],[[11,2],[10,2]],[[12,1],[10,1]]];
function holeOf(i){return HOLES[i%HOLES.length].map(function(x){return{r:x[0],s:x[1]}})}
function same(a,b){return a.r===b.r&&a.s===b.s}
function eval5(c){
  var rs=c.map(function(x){return x.r}).sort(function(a,b){return b-a}),cnt={},i;
  rs.forEach(function(r){cnt[r]=(cnt[r]||0)+1});
  var flush=c.every(function(x){return x.s===c[0].s});
  var uq=Object.keys(cnt).map(Number).sort(function(a,b){return b-a});
  var straight=false,high=0;
  if(uq.length===5){if(rs[0]-rs[4]===4){straight=true;high=rs[0]}else if(rs[0]===14&&rs[1]===5&&rs[4]===2){straight=true;high=5}}
  var g=uq.slice().sort(function(a,b){return cnt[b]-cnt[a]||b-a});
  var cat;
  if(straight&&flush)cat=high===14?9:8;
  else if(cnt[g[0]]===4)cat=7;
  else if(cnt[g[0]]===3&&cnt[g[1]]===2)cat=6;
  else if(flush)cat=5;
  else if(straight)cat=4;
  else if(cnt[g[0]]===3)cat=3;
  else if(cnt[g[0]]===2&&cnt[g[1]]===2)cat=2;
  else if(cnt[g[0]]===2)cat=1;
  else cat=0;
  var tb=straight?[high]:g,score=cat;
  for(i=0;i<5;i++)score=score*15+(tb[i]||0);
  return{cat:cat,score:score};
}
function combos(n,k){var out=[],a=[];(function rec(st){if(a.length===k){out.push(a.slice());return}for(var i=st;i<n;i++){a.push(i);rec(i+1);a.pop()}})(0);return out}
var CMB={5:combos(5,5),6:combos(6,5),7:combos(7,5)};
function bestOf(cards){var best=null,cs=CMB[cards.length];
  for(var i=0;i<cs.length;i++){var five=cs[i].map(function(j){return cards[j]}),e=eval5(five);if(!best||e.score>best.score)best={cat:e.cat,score:e.score,five:five}}
  return best}
function fullDeck(){var d=[];for(var r=2;r<=14;r++)for(var s=0;s<4;s++)d.push({r:r,s:s});return d}
function sample(arr,n){var a=arr.slice(),out=[];for(var i=0;i<n&&a.length;i++){out.push(a.splice(Math.floor(Math.random()*a.length),1)[0])}return out}
function shuffle(a){return sample(a,a.length)}
/* 役に合わせた盤面を組み立てる。
   フロップ+ターンで「ロイヤルフラッシュまであと1枚」の形(同じマークのA・K・Q・J・Tのうち4枚がそろう)を作ると、
   リバー1枚で ロイヤルフラッシュ / ストレート / フラッシュ / ワンペア のどれにも決められる。
   4枚にAを必ず含める(Aが無いと、反対側の端でストレートフラッシュになるため)。 */
function buildBoard(hole,id){
  var s0=hole[0].s,hr=[hole[0].r,hole[1].r],rem=[10,11,12,13,14].filter(function(r){return hr.indexOf(r)<0}),opts=[],i,j;
  for(i=0;i<3;i++)for(j=i+1;j<3;j++){var pair=[rem[i],rem[j]],m=rem[3-i-j];if(hr.concat(pair).indexOf(14)>=0)opts.push({pair:pair,m:m})}
  var o=opts[Math.floor(Math.random()*opts.length)];
  var broad=o.pair.map(function(r){return{r:r,s:s0}});
  var lowS=[0,1,2,3].filter(function(x){return x!==s0}),lowR=sample([2,3,4,5,6,7,8],2);
  var x={r:lowR[0],s:lowS[Math.floor(Math.random()*3)]},y={r:lowR[1],s:lowS[Math.floor(Math.random()*3)]};
  var four=shuffle(broad.concat([x,y])),base=hole.concat(four);   /* ターンまでの4枚は完全にランダムな並び */
  var used=function(c){return base.some(function(b){return same(b,c)})};
  var target={N:1,R:4,E:5,L:9}[id],cand=[];
  if(id==="L"){cand=[{r:o.m,s:s0}]}
  else if(id==="R"){cand=lowS.map(function(ss){return{r:o.m,s:ss}})}
  else if(id==="E"){for(var r=2;r<=9;r++){var c={r:r,s:s0};if(!used(c))cand.push(c)}}
  else{var ranks=base.map(function(c){return c.r}).filter(function(v,k,a){return a.indexOf(v)===k}),hp=[],op=[];
    ranks.forEach(function(r){lowS.concat([]).forEach(function(ss){var c={r:r,s:ss};if(!used(c))(hr.indexOf(r)>=0?hp:op).push(c)})});
    cand=(Math.random()<.7&&hp.length)?hp:hp.concat(op)}   /* ワンペアは手札とそろう形を7割にする */
  cand=cand.filter(function(c){return bestOf(base.concat([c])).cat===target});
  var river=cand.length?cand[Math.floor(Math.random()*cand.length)]:null;
  if(!river){var fb=fullDeck().filter(function(c){return!used(c)&&bestOf(base.concat([c])).cat===target});river=fb[Math.floor(Math.random()*fb.length)]||sample(fullDeck().filter(function(c){return!used(c)}),1)[0]}
  return four.concat([river]);
}
var PIPS={2:[[1,0],[1,6]],3:[[1,0],[1,3],[1,6]],4:[[0,0],[2,0],[0,6],[2,6]],5:[[0,0],[2,0],[1,3],[0,6],[2,6]],6:[[0,0],[2,0],[0,3],[2,3],[0,6],[2,6]],
 7:[[0,0],[2,0],[1,1.5],[0,3],[2,3],[0,6],[2,6]],8:[[0,0],[2,0],[1,1.5],[0,3],[2,3],[1,4.5],[0,6],[2,6]],
 9:[[0,0],[2,0],[0,2],[2,2],[1,3],[0,4],[2,4],[0,6],[2,6]],10:[[0,0],[2,0],[1,1],[0,2],[2,2],[0,4],[2,4],[1,5],[0,6],[2,6]]};
var PX=[2.65,3.5,4.35];
var FACE_STYLE="simple";   /* "simple"=数字とスートだけ(スクラッチカード型) / "classic"=絵札・スートの並び(素材\絵札を使う) */
function faceHTML(c,cls,mini){var col=(c.s===1||c.s===2)?"red":"blk",ch=SU[c.s],R=c.r;
  if(!mini&&FACE_STYLE==="simple")return'<div class="fc ft '+col+(cls||"")+'"><i class="rk'+(R===14||R===13?" pfd":(R===12?" pfd qq":""))+'">'+rl(R)+'</i><span class="su">'+ch+'</span></div>';
  if(mini)return'<div class="fc ft '+col+(cls||"")+'"><span class="wm"></span><i class="dm a"></i><i class="dm b"></i><i class="rk">'+rl(R)+'</i><span class="su">'+ch+'</span></div>';
  var ix='<div class="ix"><b>'+rl(R)+'</b><em>'+ch+'</em></div><div class="ix r"><b>'+rl(R)+'</b><em>'+ch+'</em></div>',body="";
  if(R===14){body=c.s===0?'<img class="ace" src="素材/A_スペード_大スート.png" alt="">':'<span class="ace g">'+ch+'</span>'}
  else if(R>=11){var nm={11:"J",12:"Q",13:"K"}[R];body='<img class="ct top" src="素材/絵札/'+nm+'.png" alt=""><img class="ct bot" src="素材/絵札/'+nm+'.png" alt="">'}
  else{PIPS[R].forEach(function(q){var x=PX[q[0]],y=1.5+q[1]*1.125;body+='<span class="pp'+(q[1]>3?" inv":"")+'" style="left:'+(x/7*100).toFixed(2)+'%;top:'+(y/9.75*100).toFixed(2)+'%">'+ch+'</span>'})}
  return'<div class="fc ft nf '+col+(cls||"")+'">'+ix+body+'</div>'}
function makeCard(c,fs,up){var d=document.createElement("div");d.className="pc";d.style.fontSize=fs+"px";
  d.innerHTML='<div class="fl'+(up?" up":"")+'"><div class="fc bk"><div class="bn"><span class="nt">Nine</span><img class="ni" src="素材/Nine_ロゴ.png" alt="Nine"></div></div>'+faceHTML(c)+'</div>';return d}
function miniCard(c,left,rot,side){return'<div class="pc flat mini '+(side||"l")+'" style="font-size:9.4px;left:'+left+'px;top:146px;transform:rotate('+rot+'deg)">'+faceHTML(c)+'</div>'}

(function(){var im=new Image();im.onload=function(){document.documentElement.classList.add("hasnine")};im.src="素材/Nine_ロゴ.png"})();
(function(){var R=document.documentElement;
  function cb(u,next){var a=new Image();a.onload=function(){R.style.setProperty("--cardback",'url("'+u+'")');R.classList.add("hascb")};a.onerror=function(){if(next)next()};a.src=u}
  cb("素材/カード裏_控えめ.png",function(){cb("素材/カード裏_中間.png",function(){cb("素材/カード裏.png")})});
  var b=new Image();b.onload=function(){R.style.setProperty("--tablebg",'url("素材/テーブル背景.png")');R.classList.add("hasbg")};b.src="素材/テーブル背景.png"})();
/* ---- パックの絵(切り取り線の位置は絵に合わせて変わる) ---- */
var STRIP=64;
/* 「パック下地_控えめ.png」があればそちらを使い、無ければ「パック下地.png」。元の画像は消さずに残す */
(function(){function tryLoad(u,cb){var im=new Image();im.onload=function(){cb(u)};im.onerror=function(){cb(null)};im.src=u}
  function use(u){document.documentElement.style.setProperty("--packimg",'url("'+u+'")');document.documentElement.classList.add("hasart");STRIP=28;document.documentElement.style.setProperty("--strip","28px")}
  tryLoad("素材/パック下地改.png",function(u0){if(u0)return use(u0);tryLoad("素材/パック下地_控えめ.png",function(u){if(u)return use(u);tryLoad("素材/パック下地.png",function(u2){if(u2)use(u2)})})})})();
/* ---- pack art ---- */
(function(){var p=[],i;for(i=0;i<=40;i++)p.push((i*5.5)+"px "+(i%2?0:5)+"px");
  for(i=40;i>=0;i--)p.push((i*5.5)+"px "+(360-(i%2?0:5))+"px");
  document.documentElement.style.setProperty("--zz","polygon("+p.join(",")+")")})();
var PACKVIEW=/pack=b/.test(location.hash)?"hidden":"open";   /* open=手札を見せる(A案) / hidden=伏せた2枚(B案)。確認用は#test&pack=b */
function miniBack(left,rot,side){return'<div class="pc flat mini mb '+side+'" style="font-size:9.4px;left:'+left+'px;top:143px;transform:rotate('+rot+'deg)"><div class="fc bk"></div></div>'}
function artHTML(i){var h=holeOf(i||0);return'<div class="art"><div class="crimp t"></div><div class="crimp b"></div><div class="frame"></div><div class="pillow"></div><div class="pn"><span class="nt script">Nine</span><img class="ni" src="素材/Nine_ロゴ.png" alt="Nine"></div>'+(PACKVIEW==="hidden"?miniBack(58,-8,"l")+miniBack(100,3,"r"):miniCard(h[0],50,-8,"l")+miniCard(h[1],104,8,"r"))+'<div class="pr serif">POKER ROOM</div><div class="pm serif">MISSION PACK</div><div class="gloss"></div><div class="sheen"></div></div>'}
[Lbody,Ltl,Ltr,Lcut].forEach(function(l){l.innerHTML=artHTML()});

/* ---- ring ---- */
var N=10,STEP=360/N,R=400,PXDEG=R*Math.PI/180;
var ang=0,vel=0,dragging=false,lastX=0,moved=0,downX=0,downY=0,snapTo=null,idleSince=performance.now();
var rps=[],PT=20,LITE=!/full/.test(location.hash);   /* #lite で軽い版(縦の絞りなし) */   /* PT=ふくらみの高さ(片側px)。表+裏でいちばん厚いところは約40px */
/* 空気で膨らんだパック: 横方向は丸く、縦方向は封(上下)の近くで急に薄くなる形 */
function zsurf(x,y){var u=(x-110)/110,v=(y-180)/180;return PT*Math.max(0,1-u*u)*Math.max(0,1-Math.pow(Math.abs(v),6))}
function buildMesh(html,cls,cols,rows){
  var w=document.createElement("div");w.className=cls;var cw=220/cols,ths=[],ws=[],L=0,c,r;
  /* 傾けた板は横幅が縮んで見えるので、板の幅を cos で広げ、絵は「曲面に沿った長さ」で貼って、板のつなぎ目の線やずれをなくす */
  for(c=0;c<cols;c++){var xc0=c*cw+cw/2,sx0=(zsurf(xc0+.5,180)-zsurf(xc0-.5,180));var th=Math.atan(sx0);ths.push(th);ws.push(cw/Math.cos(th));L+=ws[c]}
  var kx=L/220;
  for(r=0;r<rows.length-1;r++){var acc=0;for(c=0;c<cols;c++){

  var demo=/demo=|test/.test(hash);  /* 確認用の表示では、番号・履歴・続きの保存をしない */
  cur.n=demo?0:nextSerial();cur.t=Date.now();
  if(!demo){savePending();pushLog({n:cur.n,t:cur.t,id:cur.id,pts:cur.pts})}
  makeHole();
  lo=0;hi=220;renderTear();Lcut.style.transform="none";
  sBoom();flashIt("#fff6dc",.85,600);
  burst(640,169+STRIP*1.45,["#fff","#ffe9a8","#e8cc88"],70,9,900);
  /* 切り取った帯は1枚のまま、くるっと回って上へ飛んでいく。パックの口はギザギザに */
  var jp=["0 "+STRIP+"px"];for(var jx=6;jx<220;jx+=6)jp.push(jx+"px "+(STRIP-Math.round(Math.random()*6))+"px");jp.push("220px "+STRIP+"px","220px 360px","0 360px");
  Lbody.style.clipPath="polygon("+jp.join(",")+")";
  guide.style.opacity="0";
  setTimeout(function(){
    Lcut.style.transition="transform 1.1s cubic-bezier(.3,.1,.6,1),opacity 1.1s ease-in";
    Lcut.style.transform="translate(-40px,-430px) rotate(-22deg)";Lcut.style.opacity="0";seam.style.opacity="0";
  },20);
  /* 手札の2枚がパックから出てくる */
  setTimeout(function(){hcEls.forEach(function(el,k){setTimeout(function(){el.style.transform="translateY(-150px)";sFlip()},k*140)})},180);
  setTimeout(function(){Lbody.style.transform="translateY(620px)";Lbody.style.opacity="0"},1150);
  setTimeout(function(){hcEls.forEach(function(el){el.style.transition="transform .7s cubic-bezier(.3,.8,.2,1)";el.style.transform="translateY("+(174-STRIP)+"px)"})},1650);
  setTimeout(dealBoard,2450);
}
function boardCard(c,i){var el=makeCard(c,16,false);el.style.left=(324+i*130)+"px";el.style.top="232px";$("board").appendChild(el);return el}
function dealBoard(){
  state="dealing";
  boardEls=board.map(function(c,i){var el=boardCard(c,i);el.style.opacity="0";el.style.transform="translateY(-46px)";return el});
  boardEls.forEach(function(el,i){setTimeout(function(){el.style.transition="transform .5s cubic-bezier(.2,.9,.3,1),opacity .4s";el.style.opacity="1";el.style.transform="none";sFlip()},60+i*110)});
  setTimeout(flop,1050);
}
function flipCard(i){boardEls[i].firstChild.classList.add("up");sFlip();tone(660+i*110,0,.25,"triangle",.07)}
function flop(){
  state="flop";
  [0,1,2].forEach(function(i){setTimeout(function(){flipCard(i)},i*340)});
  setTimeout(function(){state="turn";boardEls[3].classList.add("hint");setHint("タップでターンをめくる","")},1400);
}
function turnTap(){
  if(state!=="turn")return;
  state="turning";setHint("","");boardEls[3].classList.remove("hint");flipCard(3);
  setTimeout(function(){setupRiver()},1000);
}
/* ---- リバー: スクイーズ(カードの下を指で持ち上げるようにめくる) ---- */
var sqEl=null,sqFace=null,sqBack=null,sqFlap=null,sqF=100,sqDrag=null,sqAnim=0,SQH=156,SQW=112;
function makeSqueeze(c,i){
  var el=document.createElement("div");el.className="sq";el.style.fontSize="16px";el.style.left=(324+i*130)+"px";el.style.top="232px";
  el.innerHTML='<div class="pc flat sqf">'+faceHTML(c)+'</div><div class="pc sqb"><div class="fc bk"><div class="bn"><span class="nt">Nine</span><img class="ni" src="素材/Nine_ロゴ.png" alt="Nine"></div></div></div><div class="pc flat sqfl">'+faceHTML(c)+'</div>';
  return el}
/* f=まだめくれていない割合(%)。折り目の高さ。めくれた部分は、折り目で180度回って表向きに見える(下の端のインデックスが正しい向きで読める) */
function sqRender(f){
  sqF=f;
  sqBack.style.clipPath="inset(-8em -8em "+(f>=99.9?"-8em":(100-f)+"%")+" -8em)";
  if(f>=99.9){sqFlap.style.display="none";return}
  sqFlap.style.display="block";
  sqFlap.style.clipPath="inset("+f+"% 0 0 0)";
  sqFlap.style.transform="translate("+SQW+"px,"+(2*f/100*SQH)+"px) rotate(180deg)";
  sqFlap.style.setProperty("--f",f+"%");
}
/* リバーをめくる前の予兆(わざと幅を持たせる): 0=ほぼ光らない(ワンペア寄り) / 1=ストレートorフラッシュ(青) / 2=フラッシュ以上確定(紫) */
function cueLevel(id){var r=Math.random();
  if(id==="N")return r<.7?0:1;
  if(id==="R")return r<.1?0:1;
  if(id==="E")return r<.5?1:2;
  return 2}
var CUEC=["#cfd6e4","#5fb0ff","#c58bff"],CUEG=["1em","1.8em","3em"],CUEO=[.22,.42,.6],CUECLS=["r-N","r-R","r-E"];
function setupRiver(msg){
  var old=boardEls[4];sqEl=makeSqueeze(board[4],4);$("board").replaceChild(sqEl,old);boardEls[4]=sqEl;
  sqFace=sqEl.querySelector(".sqf");sqBack=sqEl.querySelector(".sqb");sqFlap=sqEl.querySelector(".sqfl");
  sqRender(100);cur.gold=false;
  var lv=cur.cue,col=CUEC[lv],bk=sqBack.querySelector(".bk");
  bk.style.borderColor=col;bk.style.boxShadow="0 0 "+CUEG[lv]+" "+col;
  aura.className=CUECLS[lv]+" pulse";aura.style.opacity=CUEO[lv];
  sCue(lv);
  requestAnimationFrame(function(){sqEl.style.transform="translateX(46px) scale(1.7)"});
  state="river";setHint(msg||"カードの下から、指で上へなぞってめくる","");
}
function royalShift(){   /* ロイヤルだけ: 紫の光が、めくっている途中で金に変わる */
  var bk=sqBack.querySelector(".bk");bk.style.transition="border-color .45s,box-shadow .45s";
  bk.style.borderColor="#ffd36b";bk.style.boxShadow="0 0 3.6em .2em #ffd36b";
  aura.className="r-L pulse";aura.style.opacity=".85";
  chime([1047,1319,1568],.09,"triangle",.12);noise(0,.5,.05,3000,"highpass")}
function sqSpring(){
  cancelAnimationFrame(sqAnim);var f0=sqF,t0=performance.now();
  (function step(t){var k=Math.min(1,(t-t0)/220),e=1-Math.pow(1-k,3);sqRender(f0+(100-f0)*e);if(k<1&&state==="river")sqAnim=requestAnimationFrame(step)})(t0);
}
function sqComplete(){
  if(state!=="river")return;
  state="rivering";sqDrag=null;cancelAnimationFrame(sqAnim);setHint("","");
  sqEl.classList.add("on");sRiverDone();
  try{sqEl.animate([{transform:"translateX(46px) scale(1.7)"},{transform:"translateX(46px) scale(1.95)"},{transform:"translateX(46px) scale(1.7)"}],{duration:420,easing:"ease-out"})}catch(e){}
  setTimeout(function(){sqEl.style.transform="translateX(0) scale(1)"},650);
  setTimeout(finish,1150);
}
function finish(){
  reveal(cur.id);
  var cards=hole.concat(board),bf=bestOf(cards).five,all=hcEls.concat(boardEls);
  all.forEach(function(el,i){var t=el.classList.contains("sq")?el.querySelector(".sqf"):el;
    t.style.setProperty("--c",RC[cur.id]);t.classList.add(bf.some(function(b){return same(b,cards[i])})?"win":"dim")});
  aura.className="r-"+cur.id+" pulse";aura.style.opacity=({N:.3,R:.5,E:.6,L:.6})[cur.id];
  if(cur.id==="E"||cur.id==="L"){var ord=0;all.forEach(function(el,i){if(!bf.some(function(b){return same(b,cards[i])}))return;var t=el.classList.contains("sq")?el.querySelector(".sqf"):el;t.style.setProperty("--d",(ord*0.13)+"s");t.classList.add("shine");ord++})}
  var pe=$("ptsline");pe.textContent="+"+cur.pts.toLocaleString("en-US")+" pts ・ 追加スタック";pe.style.opacity="1";
  setTimeout(showResult,1500);
}
function reveal(id){
  var p=prizeById(id);sReveal(id);
  if(id==="N"){burst(640,400,p.cols,26,5,800)}
  else if(id==="R"){flashIt("#bfe0ff",.45,600);burst(640,400,p.cols,60,7,1000)}
  else if(id==="E"){   /* フラッシュ(専門家の助言で落ち着いた形に): 細い金の輪1回+勝った札を光がなぞる+同じマークの薄い影+チップ少し+小さな揺れ */
    flashIt("#f6efe0",.2,600);lightRing(640,400,"#e8cc88",1500,700);
    burst(640,400,["#ffffff","#f3e6c4","#e8cc88"],30,4,1100);chips(18);shake()}
  else{flashIt("#fff6e0",.55,900);burst(640,400,p.cols,80,8,1500);glitter(150,p.cols);legendOn();prism.classList.add("hot");chips(70);setTimeout(function(){chips(30)},900);shake();setTimeout(shake,850)}
  banner.textContent=({N:"ONE PAIR",R:"STRAIGHT",E:"FLUSH!",L:"ROYAL FLUSH!!"})[id];bannerIn();
}
function bannerIn(){banner.style.color=cur.id==="E"?"#f3e6c4":RC[cur.id];banner.style.opacity="1";try{banner.animate([{transform:"scale(.5)",opacity:0},{transform:"scale(1.12)",opacity:1,offset:.5},{transform:"scale(1)",opacity:1}],{duration:700,easing:"cubic-bezier(.2,.9,.3,1.2)"})}catch(e){}}
function showResult(){
  state="flipped";
  $("rSerial").textContent="No."+String(cur.n).padStart(4,"0");
  var upd=function(){$("rTime").textContent=fmtTime(new Date())};upd();clearInterval(clockTimer);clockTimer=setInterval(upd,1000);
  result.classList.add("on");$("scrim").classList.add("on");
}
function closeAll(){
  if(state!=="flipped")return;
  clearInterval(clockTimer);ls.del("nine_gacha_pending");
  state="carousel";resetOpener();
  ang=Math.round((Math.random()*N))*STEP;vel=0;snapTo=null;idleSince=performance.now();updateRing();
  ringwrap.style.opacity="1";$("floor").style.opacity="1";carouselHints();
}

/* ---- resume after reload (結果を引き直せないように。手札・フロップ・ターンまで表示して、リバーの手前から続ける) ---- */
function resumePending(){
  var s=ls.get("nine_gacha_pending");if(!s)return false;var o;try{o=JSON.parse(s)}catch(e){o=null}
  var p=o&&prizeById(o.id);if(!p||o.hi==null||!o.b){ls.del("nine_gacha_pending");return false}
  cur={id:p.id,name:p.name,pts:p.pts,cols:p.cols,n:o.n,t:o.t,cue:(o.q!=null?o.q:cueLevel(p.id))};selIdx=o.hi;hole=holeOf(selIdx);board=o.b.map(function(x){return{r:x[0],s:x[1]}});
  [Lbody,Ltl,Ltr,Lcut].forEach(function(l){l.innerHTML=artHTML(selIdx)});
  ringwrap.style.opacity="0";$("floor").style.opacity="0";guide.style.opacity="0";$("brand").classList.add("off");document.documentElement.classList.add("tbon");pk.style.display="block";pk.className="big";
  Ltl.style.opacity=Ltr.style.opacity=Lcut.style.opacity="0";Lbody.style.opacity="0";
  makeHole();hcEls.forEach(function(el){el.style.transition="none";el.style.transform="translateY("+(174-STRIP)+"px)"});
  boardEls=board.map(function(c,i){var el=boardCard(c,i);if(i<4){el.firstChild.style.transition="none";el.firstChild.classList.add("up")}return el});
  setupRiver("前回の続きです。カードの下から、指で上へなぞってめくる");return true;
}

/* ---- pointer ---- */
stage.addEventListener("pointerdown",function(e){
  audioInit();idleSince=performance.now();
  var s=toStage(e);
  if(e.target.closest&&e.target.closest("button,#modal"))return;
  try{stage.setPointerCapture(e.pointerId)}catch(x){}
  downX=s.x;downY=s.y;moved=0;lastX=s.x;
  if(state==="carousel"){dragging=true;vel=0;snapTo=null}
  else if(state==="river"&&sqEl){
    var rc=sqEl.getBoundingClientRect();
    if(e.clientX>rc.left-30&&e.clientX<rc.right+30&&e.clientY>rc.top-30&&e.clientY<rc.bottom+30){cancelAnimationFrame(sqAnim);sqDrag={y0:e.clientY,k:rc.height/SQH,f0:sqF}}
  }
  else if(state==="tearable"){
    var px=Math.max(0,Math.min(220,(s.x-480.5)/1.45));
    if(s.y>130&&s.y<169+STRIP*1.45+78&&s.x>420&&s.x<860){tearing=true;x0=px;lo=hi=px;usedMin=usedMax=px;arrow.classList.remove("on");guide.style.opacity="0";renderTear()}
  }
});
stage.addEventListener("pointermove",function(e){
  var s=toStage(e);moved+=Math.abs(s.x-lastX);
  if(state==="carousel"&&dragging){var dx=s.x-lastX;ang+=dx/PXDEG;vel=vel*.6+(dx/PXDEG)*.4;idleSince=performance.now()}
  else if(state==="river"&&sqDrag){
    var dl=(sqDrag.y0-e.clientY)/sqDrag.k,ff=Math.max(30,Math.min(100,sqDrag.f0-dl/SQH*100));
    sqRender(ff);sSqueeze((100-ff)/48);
    if(cur.id==="L"&&!cur.gold&&ff<=68){cur.gold=true;royalShift()}
    if(ff<=52)sqComplete();
  }
  else if(state==="tearable"&&tearing){
    var px=Math.max(0,Math.min(220,(s.x-480.5)/1.45));
    usedMin=Math.min(usedMin,px);usedMax=Math.max(usedMax,px);lo=usedMin;hi=usedMax;
    renderTear();var pr=(hi-lo)/220;sTear(pr);
    if(Math.random()<.7)burst(480.5+px*1.45,169+STRIP*1.45,["#fff2c4","#ffd88a"],2,3,420);
    if(pr>=.82)completeTear();
  }
  lastX=s.x;
});
function up(e){
  var s=toStage(e);
  if(state==="carousel"){
    dragging=false;
    if(moved<12){
      if(Math.abs(s.x-640)<135&&s.y>240&&s.y<620)selectPack();
      else if(s.x<505){snapTo=Math.round(ang/STEP)*STEP+STEP;vel=0}
      else if(s.x>775){snapTo=Math.round(ang/STEP)*STEP-STEP;vel=0}
    }
  }else if(state==="tearable"){
    if(tearing){tearing=false;if(state==="tearable"){resetTear();guide.style.opacity="";arrow.classList.add("on")}}
    else if(moved<12){sTap()}
  }else if(state==="turn"&&moved<14){turnTap()}
  else if(state==="river"){if(sqDrag){sqDrag=null;sqSpring()}}
}
stage.addEventListener("pointerup",up);
stage.addEventListener("pointercancel",function(){dragging=false;if(state==="river"&&sqDrag){sqDrag=null;sqSpring()}if(state==="tearable"&&tearing){tearing=false;resetTear();guide.style.opacity="";arrow.classList.add("on")}});
/* 誤タップで当選画面が消えないよう、2回押して閉じる */
(function(){var armed=false,tm=null,b=$("btnClose"),T0="スタッフの確認が終わったら押す";
  b.addEventListener("click",function(){
    if(!armed){armed=true;b.textContent="もう一度押すと閉じます";clearTimeout(tm);tm=setTimeout(function(){armed=false;b.textContent=T0},3000);return}
    armed=false;clearTimeout(tm);b.textContent=T0;closeAll();
  })})();

/* ---- buttons / modal ---- */
$("btnSnd").addEventListener("click",function(){audioInit();muted=!muted;this.textContent=muted?"音 OFF":"音 ON"});
function openModal(html){$("modalBox").innerHTML=html+'<button type="button" id="mClose">閉じる</button>';$("modal").classList.add("on");$("mClose").onclick=function(){$("modal").classList.remove("on")}}
$("btnProb").addEventListener("click",function(){
  var rows=PRIZES.map(function(p){return"<tr><td>"+p.name+"</td><td>+"+p.pts.toLocaleString("en-US")+" pts</td><td>"+Math.round(p.w/TOTAL*1000)/10+"%</td></tr>"}).join("");
  openModal('<h3>当たりの内容と確率</h3><table><tr><th>ランク</th><th>追加スタック</th><th>確率</th></tr>'+rows+'</table><p>ハズレはありません。どのパックを選んでも、中身の確率は同じです。当たった内容は、スタッフが確認してお渡しします。</p>');
});
(function(){var t=null;var b=$("brand");
  b.addEventListener("pointerdown",function(){t=setTimeout(function(){
    var a=[];try{a=JSON.parse(ls.get("nine_gacha_log")||"[]")}catch(x){}
    var rows=a.slice(0,30).map(function(o){var p=prizeById(o.id)||{name:"?"};return"<tr><td>No."+String(o.n).padStart(4,"0")+"</td><td>"+fmtTime(new Date(o.t))+"</td><td>"+p.name+" +"+o.pts.toLocaleString("en-US")+"</td></tr>"}).join("");
    openModal('<h3>履歴(スタッフ用・この端末の直近30回)</h3><table>'+(rows||"<tr><td>まだありません</td></tr>")+'</table>')},1500)});
  ["pointerup","pointerleave","pointercancel"].forEach(function(ev){b.addEventListener(ev,function(){clearTimeout(t)})})})();

/* ---- 確認モード(URLの末尾に #test): 出る役とパックを選んで、すべての演出を確認できる。番号・履歴は保存しない ---- */
(function(){
  if(!/test/.test(hash))return;
  var bar=$("testbar");bar.style.display="block";
  var rk=[["","ランダム"],["N","ONE PAIR"],["R","STRAIGHT"],["E","FLUSH"],["L","ROYAL FLUSH"]];
  var h='<b>確認モード(結果は保存されません)</b><div class="row" id="tbR">';
  rk.forEach(function(r){h+='<button type="button" data-r="'+r[0]+'"'+(r[0]===""?' class="on"':'')+'>'+r[1]+'</button>'});
  h+='</div><b>パック(押すと中央に回る)</b><div class="row" id="tbP">';
  for(var i=0;i<N;i++)h+='<button type="button" data-p="'+i+'">'+(i+1)+'</button>';
  h+='</div><b>パックの手札</b><div class="row" id="tbV"><button type="button" data-v="a"'+(PACKVIEW==="open"?' class="on"':'')+'>A 見せる</button><button type="button" data-v="b"'+(PACKVIEW==="hidden"?' class="on"':'')+'>B 伏せる</button></div>';bar.innerHTML=h;
  $("tbV").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;location.hash=b.getAttribute("data-v")==="b"?"#test&pack=b":"#test";location.reload()});
  $("tbR").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;forceRank=b.getAttribute("data-r")||null;[].forEach.call($("tbR").children,function(x){x.className=x===b?"on":""})});
  $("tbP").addEventListener("click",function(e){var b=e.target.closest("button");if(!b||state!=="carousel")return;var i=+b.getAttribute("data-p");ang=-i*STEP;vel=0;snapTo=null;idleSince=performance.now();updateRing();
    [].forEach.call($("tbP").children,function(x){x.className=x===b?"on":""})});
})();

/* ---- demo(確認用: URLの末尾に #demo=tear / #demo=risen-L / #demo=flip-E 等) ---- */
(function(){
  if(!/demo=/.test(hash))return;
  if(/demo=tear/.test(hash)){selectPack();setTimeout(function(){lo=70;hi=150;renderTear()},700);return}
  if(/demo=(risen|flip)-/.test(hash)){
    selectPack();
    setTimeout(function(){completeTear()},700);
    if(/demo=flip-/.test(hash)){var dt=setInterval(function(){if(state==='turn')turnTap();if(state==='river')sqComplete();if(state==='flipped')clearInterval(dt)},800)}
  }
})();
if(!/demo=|test/.test(hash))resumePending();
</script>
